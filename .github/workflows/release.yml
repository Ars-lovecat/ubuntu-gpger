name: Build and publish apt repo

# v로 시작하는 태그를 push하면 자동 실행됨 (예: git tag v0.3.0 && git push --tags)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # fingerprint는 비밀 정보가 아니라(공개키 배포용으로 원래 공개돼야 하는 값) Secrets에
    # 등록할 필요 없이 여기 그대로 적어둔다. 실제로 비밀이어야 하는 건 GPG_KEY(개인키)뿐.
    env:
      GPG_FINGERPRINT: 7DD122403D82C2CD817ECB7711282C49660F38A0
      # 태그 이름을 run: 블록에 ${{ }}로 직접 문자열 치환하면, 태그에 쉘 특수문자가
      # 들어있을 때 명령 주입 여지가 생긴다. env로 한 번 감싸서 쉘 변수로만 참조한다
      # (태그를 밀 수 있는 사람은 이미 쓰기 권한이 있어 실제 위험은 낮지만, 방어 심층화 차원).
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 태그에서 버전 추출 (v0.3.0 -> 0.3.0)
        id: version
        run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 문법 사전 검사 (dpkg-deb --build는 패키징할 스크립트를 실행/검증하지 않음)
        run: |
          python3 -m py_compile bin/gpger
          bash -n packaging/deb/build.sh

      - name: 의존성 설치 (aptly)
        run: |
          sudo apt-get update
          sudo apt-get install -y aptly gnupg

      - name: .deb 빌드
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x packaging/deb/build.sh
          ./packaging/deb/build.sh "$VERSION"

      - name: GPG 서명 키 임포트
        run: |
          echo "${{ secrets.GPG_KEY }}" | gpg --batch --import
          # CI 러너에는 실제 터미널이 없어서 pinentry가 뜨면
          # "Inappropriate ioctl for device"로 죽는다. loopback 모드로 강제해서
          # -passphrase로 넘긴 값을 그대로 쓰게 한다.
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent

      - name: aptly 저장소 생성 및 발행
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          aptly repo create -distribution="stable" -component="main" gpger-repo
          aptly repo add gpger-repo "packaging/deb/gpger_${VERSION}_all.deb"

          if [ -n "$GPG_PASSPHRASE" ]; then
            # -passphrase로 직접 넘기면 다른 프로세스가 ps/procfs로 커맨드라인 인자를
            # 볼 수 있어서, 파일로 넘기는 -passphrase-file을 대신 쓴다 (러너는 매번 새
            # 단일 사용자 VM이라 실제 위험은 낮지만, 방어 심층화 차원). 파일은 이 실행
            # 안에서만 쓰고 바로 지운다.
            PASSPHRASE_FILE=$(mktemp)
            chmod 600 "$PASSPHRASE_FILE"
            printf '%s' "$GPG_PASSPHRASE" > "$PASSPHRASE_FILE"
            aptly publish repo -architectures="amd64,arm64" \
              -gpg-key="$GPG_FINGERPRINT" -passphrase-file="$PASSPHRASE_FILE" \
              gpger-repo
            rm -f "$PASSPHRASE_FILE"
          else
            aptly publish repo -architectures="amd64,arm64" \
              -gpg-key="$GPG_FINGERPRINT" \
              gpger-repo
          fi

          gpg --armor --export "$GPG_FINGERPRINT" > ~/.aptly/public/gpger-key.asc
          touch ~/.aptly/public/.nojekyll

      - name: 빌드 산출물 / pool / Packages 기록의 sha256이 전부 동일한지 확인
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DEB="packaging/deb/gpger_${VERSION}_all.deb"
          POOL="$HOME/.aptly/public/pool/main/g/gpger/gpger_${VERSION}_all.deb"

          LOCAL_SHA=$(sha256sum "$DEB" | awk '{print $1}')
          POOL_SHA=$(sha256sum "$POOL" | awk '{print $1}')
          echo "빌드 산출물 sha256: $LOCAL_SHA"
          echo "pool 파일 sha256:   $POOL_SHA"
          if [ "$LOCAL_SHA" != "$POOL_SHA" ]; then
            echo "::error::pool의 .deb가 빌드 산출물과 다릅니다 (파이프라인 무결성 문제)"
            exit 1
          fi

          for ARCH in amd64 arm64; do
            PKG_FILE="$HOME/.aptly/public/dists/stable/main/binary-$ARCH/Packages"
            RECORDED_SHA=$(awk '
              /^Package: / { p = ($2 == "gpger") }
              p && /^SHA256: / { print $2 }
            ' "$PKG_FILE")
            echo "Packages($ARCH) 기록 sha256: $RECORDED_SHA"
            if [ "$RECORDED_SHA" != "$LOCAL_SHA" ]; then
              echo "::error::Packages($ARCH)에 기록된 sha256이 빌드 산출물과 다릅니다"
              exit 1
            fi
          done

      - name: GitHub Release 생성 (태그와 연동, .deb 첨부로 추적성 확보 / 재실행 시 덮어쓰기)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DEB="packaging/deb/gpger_${VERSION}_all.deb"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME가 이미 있습니다 (재실행) — 자산만 덮어씁니다."
            gh release upload "$TAG_NAME" "$DEB" --clobber
          else
            gh release create "$TAG_NAME" "$DEB" \
              --title "gpger $TAG_NAME" \
              --generate-notes
          fi

      - name: gh-pages 브랜치로 발행 (기존 내용을 최신 스냅샷으로 교체)
        env:
          GITHUB_TOKEN_FOR_PUSH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ~/.aptly/public
          git init -q
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git checkout -q -B gh-pages
          git add -A
          git commit -q -m "저장소 발행: $TAG_NAME"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN_FOR_PUSH}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
